[project]
name = "uncawe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lorenzo Volpi", email = "lorenzo.volpi@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cap-ml",
    "datasets>=4.8.5",
    "matplotlib>=3.10.0",
    "pandas>=3.0.2",
    "pandatex",
    "requests>=2.33.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
]

[project.scripts]
uncawe = "uncawe:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-environments = "sys_platform == 'linux' and platform_machine == 'aarch64'"
# numpyro 0.22.0 breaks ACC_BayesCAP (Multinomial constraint on a traced total count); 0.21.0 produced the stored results.
constraint-dependencies = ["numpyro<0.22"]

[tool.uv.sources]
cap-ml = { git = "https://github.com/lorenzovolpi/cap-ml.git", rev = "devel" }
pandatex = { git = "https://github.com/lorenzovolpi/pandatex.git" }


[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
